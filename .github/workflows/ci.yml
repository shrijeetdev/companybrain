name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The committed bundle is what production runs, so build it here and fail if the
      # checked-in dist/server.js is stale relative to source.
      - name: Build
        run: pnpm build

      - name: Check the committed bundle is up to date
        run: |
          if ! git diff --quiet -- dist/server.js; then
            echo "::error::dist/server.js is stale — run 'pnpm build' and commit the result."
            git diff --stat -- dist/server.js
            exit 1
          fi

      # Boots the real app and checks auth, the security headers, and that every tab
      # renders — the class of breakage unit tests cannot see.
      - name: Smoke end-to-end
        run: node scripts/smoke.mjs
