packages:
  - "packages/*"
  - "cli"

# pnpm 11+ requires explicit approval for packages that run install scripts.
# esbuild is disabled here on purpose: its postinstall self-check spawns its
# own binary, which fails with EACCES on Hostinger's build sandbox. esbuild is
# only a devDependency used locally to produce the committed dist/server.js —
# it is never invoked on the server, so skipping its install script is safe.
allowBuilds:
  better-sqlite3: true
  esbuild: false
  protobufjs: true

# Allow git-based transitive deps (e.g. @whiskeysockets/baileys pulls one in).
blockExoticSubdeps: false
