packages:
  - "packages/*"
  - "cli"

# Native/install-script packages that are allowed to run their build scripts.
# esbuild's postinstall is skipped on purpose (it fails with EACCES on Hostinger's build
# sandbox); esbuild/vite are only used locally to produce the committed dist/.
onlyBuiltDependencies:
  - better-sqlite3
allowBuilds:
  better-sqlite3: true
  esbuild: false
  protobufjs: true
